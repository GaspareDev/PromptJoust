[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptjoust"
version = "1.0.0"
description = "Deterministic prompt battle engine and LLM martial arts arena"
readme = "README.md"
authors = [{ name = "Andrea Guida" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "flake8>=6.1.0",
    "black>=23.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "providers*", "interfaces*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
